[package]
name = "drone-server"
version = "0.1.0"
edition = "2021"
description = "Drone Server: MAVLink telemetry and control for SAR (TUI + library)"
default-run = "tui"

[lib]
name = "drone_server"

[[bin]]
name = "tui"
path = "src/bin/tui/main.rs"

[[bin]]
name = "drone-http"
path = "src/bin/drone_http.rs"

[dependencies]
mavlink = { version = "0.17", features = ["ardupilotmega", "direct-serial", "udp"] }
# unstable-rendered-line-info: Paragraph::line_count (scroll log to latest wrapped lines).
ratatui = { version = "0.29", features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = { version = "0.28", features = ["event-stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# --- drone-http API binary ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4.5", features = ["derive"] }
