[package]
name = "mavlink-telemetry"
version = "0.1.0"
edition = "2021"
description = "Minimal MAVLink telemetry reader for Pixhawk over serial"
default-run = "tui"

[lib]

[dependencies]
mavlink = { version = "0.17", features = ["ardupilotmega", "direct-serial", "udp"] }
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
