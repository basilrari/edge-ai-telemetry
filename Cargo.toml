[package]
name = "drone-server"
version = "0.1.0"
edition = "2021"
description = "Drone Server: MAVLink telemetry and control for SAR (TUI + library)"
default-run = "tui"

[lib]
name = "drone_server"

[dependencies]
mavlink = { version = "0.17", features = ["ardupilotmega", "direct-serial", "udp"] }
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
